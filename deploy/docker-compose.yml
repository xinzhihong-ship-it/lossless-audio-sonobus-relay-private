services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lossless_audio}
      POSTGRES_USER: ${POSTGRES_USER:-lossless_audio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mediamtx:
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_VIDEO_HOST}
      MTX_WEBRTCLOCALUDPADDRESS: ":${VIDEO_WEBRTC_PORT:-19091}"
      MTX_AUTHINTERNALUSERS_0_USER: ${MEDIA_MTX_API_USERNAME:-media-api}
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIA_MTX_API_PASSWORD}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${VIDEO_RTSP_PORT:-19092}:8554/tcp"
      - "${VIDEO_WEBRTC_PORT:-19091}:${VIDEO_WEBRTC_PORT:-19091}/udp"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER:-lossless_audio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lossless_audio}
      MAX_BYTES_PER_SECOND_PER_CLIENT: ${MAX_BYTES_PER_SECOND_PER_CLIENT:-52428800}
      UDP_RELAY_PORT: ${UDP_RELAY_PORT:-9000}
      CONNECTION_SERVER_ADMIN_URL: http://connection-server:18098
      WEB_BRIDGE_ADMIN_URL: http://web-bridge:18100
      PUBLIC_VIDEO_HOST: ${PUBLIC_VIDEO_HOST}
      PUBLIC_HTTP_PORT: ${PUBLIC_HTTP_PORT:-19090}
      MEDIA_MTX_ADMIN_URL: http://mediamtx:9997
      MEDIA_MTX_API_USERNAME: ${MEDIA_MTX_API_USERNAME:-media-api}
      MEDIA_MTX_API_PASSWORD: ${MEDIA_MTX_API_PASSWORD}
      VIDEO_RTSP_PORT: ${VIDEO_RTSP_PORT:-19092}
      MEDIA_MUXER_USERNAME: ${MEDIA_MUXER_USERNAME:-media-muxer}
      MEDIA_MUXER_PASSWORD: ${MEDIA_MUXER_PASSWORD}
    ports:
      - "${UDP_RELAY_PORT:-9000}:${UDP_RELAY_PORT:-9000}/udp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      - postgres
      - connection-server
      - mediamtx

  connection-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.connection-server
    restart: unless-stopped
    environment:
      CONNECTION_SERVER_PORT: ${CONNECTION_SERVER_PORT:-10998}
      CONNECTION_SERVER_ADMIN_PORT: 18098
    ports:
      - "${CONNECTION_SERVER_PORT:-10998}:${CONNECTION_SERVER_PORT:-10998}/tcp"
      - "${CONNECTION_SERVER_PORT:-10998}:${CONNECTION_SERVER_PORT:-10998}/udp"

  web-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web-bridge
    restart: unless-stopped
    environment:
      BRIDGE_CONNECTION_HOST: connection-server
      BRIDGE_CONNECTION_PORT: ${CONNECTION_SERVER_PORT:-10998}
      BRIDGE_GROUP: ${WEB_BRIDGE_GROUP:-web}
      BRIDGE_USERNAME: ${WEB_BRIDGE_USERNAME:-web-bridge}
      BRIDGE_GROUP_PASSWORD: ${WEB_BRIDGE_GROUP_PASSWORD:-}
      BRIDGE_ADMIN_PORT: 18100
      BRIDGE_RELAY_HOST: server
      BRIDGE_RELAY_PORT: ${UDP_RELAY_PORT:-9000}
    depends_on:
      - connection-server
      - server

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-19090}:80"
      - "127.0.0.1:${ADMIN_HTTP_PORT:-19094}:8081"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - mediamtx

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
