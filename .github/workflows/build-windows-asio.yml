name: Build Windows SonoBus ASIO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - private-main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-asio.yml"
      - "sonobus/**"
      - "tools/windows-installer/**"
      - "README.md"
      - "LICENSE"
      - "LICENSE_EXCEPTION"
      - "NOTICE.md"

permissions:
  contents: write

jobs:
  build-windows-asio:
    name: Windows x64 Release ASIO
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download pinned FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "7.1.1"
          $expected = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-windows"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem -Path $extract -Filter LICENSE -File -Recurse | Select-Object -First 1
          $readme = Get-ChildItem -Path $extract -Filter README.txt -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $license -or $null -eq $readme) { throw "FFmpeg runtime archive is incomplete." }
          $versionInfo = (& $ffmpeg.FullName -hide_banner -version 2>&1 | Out-String)
          $demuxers = (& $ffmpeg.FullName -hide_banner -demuxers 2>&1 | Out-String)
          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          $muxers = (& $ffmpeg.FullName -hide_banner -muxers 2>&1 | Out-String)
          if ($versionInfo -notmatch "ffmpeg version 7\.1\.1") { throw "Unexpected FFmpeg version." }
          if ($demuxers -notmatch "\brawvideo\b") { throw "FFmpeg runtime lacks raw NV12 input." }
          if ($encoders -notmatch "\b(h264_nvenc|h264_qsv|h264_amf|h264_mf|libx264)\b") { throw "FFmpeg runtime lacks an H.264 encoder." }
          if ($muxers -notmatch "\brtsp\b") { throw "FFmpeg runtime lacks the RTSP muxer." }
          "SONOBUS_FFMPEG_PATH=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SONOBUS_FFMPEG_LICENSE=$($license.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SONOBUS_FFMPEG_README=$($readme.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Steinberg ASIO SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkUrl = "https://www.steinberg.net/asiosdk"
          $zipPath = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "asiosdk"

          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $commonPath = Get-ChildItem -Path $extractPath -Directory -Recurse |
            Where-Object { $_.Name -eq "common" -and (Test-Path (Join-Path $_.FullName "iasiodrv.h")) } |
            Select-Object -First 1

          if ($null -eq $commonPath) {
            Write-Error "Downloaded ASIO SDK, but could not find common/iasiodrv.h."
          }

          New-Item -ItemType Directory -Force -Path asiosdk | Out-Null
          Copy-Item -Recurse -Force $commonPath.FullName asiosdk/common
          Get-ChildItem asiosdk/common | Select-Object Name, Length

      - name: Configure
        shell: pwsh
        working-directory: sonobus
        run: >
          cmake
          -G "Visual Studio 17 2022"
          -A x64
          -DSONOBUS_ENABLE_ASIO=ON
          -DSONOBUS_BUILD_VIDEO_TESTS=ON
          -DSONOBUS_FFMPEG_PATH="$env:SONOBUS_FFMPEG_PATH"
          -B build

      - name: Build
        shell: pwsh
        working-directory: sonobus
        run: cmake --build build --config Release --parallel

      - name: Test video protocol and UTF-8
        shell: pwsh
        working-directory: sonobus
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify bundled FFmpeg runtimes
        shell: pwsh
        run: |
          $sourceHash = (Get-FileHash -Algorithm SHA256 $env:SONOBUS_FFMPEG_PATH).Hash
          $runtimes = @(
            "sonobus/build/SonoBus_artefacts/Release/Standalone/ffmpeg.exe",
            "sonobus/build/SonoBus_artefacts/Release/VST3/SonoBus.vst3/Contents/x86_64-win/ffmpeg.exe",
            "sonobus/build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3/Contents/x86_64-win/ffmpeg.exe"
          )
          foreach ($runtime in $runtimes) {
            if (-not (Test-Path $runtime)) { throw "Missing bundled runtime: $runtime" }
            if ((Get-FileHash -Algorithm SHA256 $runtime).Hash -ne $sourceHash) { throw "Bundled runtime checksum mismatch: $runtime" }
          }
          $helpers = @(
            "sonobus/build/SonoBus_artefacts/Release/Standalone/SonoBusVideoCaptureHelper.exe",
            "sonobus/build/SonoBus_artefacts/Release/VST3/SonoBus.vst3/Contents/x86_64-win/SonoBusVideoCaptureHelper.exe",
            "sonobus/build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3/Contents/x86_64-win/SonoBusVideoCaptureHelper.exe"
          )
          foreach ($helper in $helpers) {
            if (-not (Test-Path $helper)) { throw "Missing bundled SharedReadOnly helper: $helper" }
          }
          & $helpers[0] --list | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "SharedReadOnly camera helper smoke test failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-x64-asio | Out-Null
          Copy-Item -Recurse -Force sonobus/build/SonoBus_artefacts/Release/Standalone/SonoBus.exe artifacts/windows-x64-asio/
          Copy-Item -Recurse -Force sonobus/build/SonoBus_artefacts/Release/VST3/SonoBus.vst3 artifacts/windows-x64-asio/
          Copy-Item -Recurse -Force sonobus/build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3 artifacts/windows-x64-asio/
          Copy-Item -Force sonobus/build/SonoBus_artefacts/Release/Standalone/ffmpeg.exe artifacts/windows-x64-asio/
          Copy-Item -Force sonobus/build/SonoBus_artefacts/Release/Standalone/SonoBusVideoCaptureHelper.exe artifacts/windows-x64-asio/
          Copy-Item -Force $env:SONOBUS_FFMPEG_LICENSE artifacts/windows-x64-asio/ffmpeg-LICENSE
          Copy-Item -Force $env:SONOBUS_FFMPEG_README artifacts/windows-x64-asio/ffmpeg-README.txt
          Copy-Item -Force docs/ffmpeg-runtime.md artifacts/windows-x64-asio/ffmpeg-RUNTIME.md
          Copy-Item -Force README.md,LICENSE,LICENSE_EXCEPTION,NOTICE.md artifacts/windows-x64-asio/
          Copy-Item -Force sonobus/LICENSE artifacts/windows-x64-asio/sonobus-LICENSE
          Copy-Item -Force sonobus/LICENSE_EXCEPTION artifacts/windows-x64-asio/sonobus-LICENSE_EXCEPTION

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-input/SonoBus | Out-Null
          Copy-Item -Recurse -Force artifacts/windows-x64-asio/* installer-input/SonoBus/
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DSBVERSION="0.1.5" `
            /DSBASIOSUFFIX="-ASIO" `
            tools/windows-installer/sonobus-installer.iss

      - name: Verify installer payload
        shell: pwsh
        run: tools/windows-installer/verify-installer.ps1 -Installer (Get-ChildItem installer-output/*.exe).FullName

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64-asio/* -DestinationPath sonobus-windows-x64-asio.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonobus-windows-x64-asio
          path: sonobus-windows-x64-asio.zip

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonobus-windows-x64-asio-installer
          path: installer-output/*.exe

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME sonobus-windows-x64-asio.zip (Get-ChildItem installer-output/*.exe).FullName --clobber
