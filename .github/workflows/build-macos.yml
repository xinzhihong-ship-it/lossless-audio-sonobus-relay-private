name: Build macOS SonoBus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-macos.yml"
      - "sonobus/**"
      - "tools/macos/**"
      - "README.md"
      - "LICENSE"
      - "LICENSE_EXCEPTION"
      - "NOTICE.md"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build pinned universal FFmpeg runtime
        run: |
          chmod +x tools/macos/build-ffmpeg-video.sh
          tools/macos/build-ffmpeg-video.sh artifacts/ffmpeg-macos-universal

      - name: Configure
        working-directory: sonobus
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DUniversalBinary=ON \
            -DSONOBUS_FFMPEG_PATH="${GITHUB_WORKSPACE}/artifacts/ffmpeg-macos-universal/ffmpeg" \
            -B build

      - name: Build
        working-directory: sonobus
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Fix macOS bundle identity
        run: tools/fix-macos-sonobus-bundles.sh sonobus

      - name: Verify bundled FFmpeg runtimes
        run: |
          for runtime in \
            sonobus/build/SonoBus_artefacts/Release/Standalone/SonoBus.app/Contents/Helpers/SonoBusVideoHelper.app/Contents/MacOS/ffmpeg \
            sonobus/build/SonoBus_artefacts/Release/VST3/SonoBus.vst3/Contents/Helpers/SonoBusVideoHelper.app/Contents/MacOS/ffmpeg \
            sonobus/build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3/Contents/Helpers/SonoBusVideoHelper.app/Contents/MacOS/ffmpeg \
            sonobus/build/SonoBus_artefacts/Release/AU/SonoBus.component/Contents/Helpers/SonoBusVideoHelper.app/Contents/MacOS/ffmpeg
          do
            test -x "$runtime"
            archs="$(lipo -archs "$runtime")"
            [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]]
            helper_app="$(dirname "$(dirname "$(dirname "$runtime")")")"
            codesign --verify --strict "$helper_app"
            codesign -d --entitlements :- "$helper_app" 2>&1 | grep -q com.apple.security.device.camera
          done

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/macos-universal
          cp -pR sonobus/build/SonoBus_artefacts/Release/Standalone/SonoBus.app artifacts/macos-universal/
          cp -pR sonobus/build/SonoBus_artefacts/Release/VST3/SonoBus.vst3 artifacts/macos-universal/
          cp -pR sonobus/build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3 artifacts/macos-universal/
          if [ -d sonobus/build/SonoBus_artefacts/Release/AU/SonoBus.component ]; then
            cp -pR sonobus/build/SonoBus_artefacts/Release/AU/SonoBus.component artifacts/macos-universal/
          fi
          if [ -d sonobus/build/SonoBus_artefacts/Release/LV2/SonoBus.lv2 ]; then
            cp -pR sonobus/build/SonoBus_artefacts/Release/LV2/SonoBus.lv2 artifacts/macos-universal/
          fi
          cp -p README.md LICENSE LICENSE_EXCEPTION NOTICE.md artifacts/macos-universal/
          cp -p sonobus/LICENSE artifacts/macos-universal/sonobus-LICENSE
          cp -p sonobus/LICENSE_EXCEPTION artifacts/macos-universal/sonobus-LICENSE_EXCEPTION
          cp -p artifacts/ffmpeg-macos-universal/ffmpeg-LICENSE-LGPL-2.1 artifacts/macos-universal/
          cp -p docs/ffmpeg-runtime.md artifacts/macos-universal/ffmpeg-RUNTIME.md
          ditto -c -k --sequesterRsrc --keepParent artifacts/macos-universal sonobus-macos-universal.zip

      - name: Build pkg installer
        run: |
          chmod +x tools/macos/build-pkg.sh
          tools/macos/build-pkg.sh 0.1.4 sonobus-macos-universal.pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonobus-macos-universal
          path: sonobus-macos-universal.zip

      - name: Upload pkg installer
        uses: actions/upload-artifact@v4
        with:
          name: sonobus-macos-universal-installer
          path: sonobus-macos-universal.pkg

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sonobus-macos-universal.zip sonobus-macos-universal.pkg --clobber
